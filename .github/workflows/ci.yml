name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Test
        run: pytest -q

      - name: Benchmark still improves (regression guard)
        run: |
          python - <<'PY'
          from evolver.bench.runner import run_benchmark
          from evolver.core.config import Config
          r = run_benchmark(Config(), epochs=4)
          first, last = r.first, r.last
          assert last.success_rate > first.success_rate, "success rate did not improve"
          assert last.avg_tokens < first.avg_tokens, "token cost did not fall"
          print("evolution intact:", r.summary())
          PY
