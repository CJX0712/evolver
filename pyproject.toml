[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evolver"
version = "0.1.0"
description = "The self-evolving layer for AI agents: skill distillation, autonomous curation, CodeAct execution, and a benchmark that proves agents get better with use."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Evolver Contributors" }]
keywords = [
    "ai-agent",
    "llm",
    "self-evolving",
    "skill-distillation",
    "codeact",
    "context-engineering",
    "agent-memory",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core is dependency-free by design: the engine must import anywhere.
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
tokens = ["tiktoken>=0.6"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
all = ["openai>=1.0", "anthropic>=0.30", "tiktoken>=0.6", "pytest>=8.0"]

[project.scripts]
evolver = "evolver.cli:main"

[tool.setuptools.packages.find]
include = ["evolver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
